name: arrecifes-de-memoria

services:
  web:
    build:
      context: .
    image: ${ARRECIFES_IMAGE:-arrecifes-de-memoria:local}
    pull_policy: never
    # El proceso escucha directamente en el loopback del host Linux.
    network_mode: host
    environment:
      RANKINGS_DEVELOPMENT: "1"
      RANKINGS_HOST: 127.0.0.1
      RANKINGS_PORT: "${HTTP_PORT:-8090}"
      RANKINGS_DB: /var/lib/arrecifes/state/rankings.sqlite
    volumes:
      - rankings:/var/lib/arrecifes
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.RANKINGS_PORT + '/api/v1/catalog', { signal: AbortSignal.timeout(2000) }).then(response => { if (!response.ok) process.exitCode = 1; }).catch(() => { process.exitCode = 1; });"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  rankings:
